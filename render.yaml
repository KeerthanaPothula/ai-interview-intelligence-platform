# render.yaml — Render Infrastructure as Code
# https://render.com/docs/infrastructure-as-code
#
# Free-tier configuration: Render Free plan (512 MB RAM, spins down after
# 15 min idle). Audio processing (Whisper / PyTorch) is intentionally
# disabled — those libraries consume ~300–400 MB at startup and would
# immediately OOM-kill the free instance. All other features (resume upload,
# AI question generation, live interview, readiness score, reports,
# analytics) remain fully functional.
#
# To enable audio later, upgrade to the Starter plan ($7/mo, 512 MB) or
# Standard plan ($25/mo, 2 GB) and set ENABLE_AUDIO_PROCESSING=true.
#
# Secrets marked `sync: false` MUST be added manually in the Render dashboard
# under Environment → Environment Variables before the first deploy.

services:
  - type: web
    name: aiip-backend
    runtime: docker

    # Docker build context is the backend/ subdirectory of the monorepo.
    rootDir: backend
    dockerfilePath: Dockerfile

    # Region — choose the region closest to your Neon database.
    # Neon free tier defaults to aws-us-east-2 (Ohio).
    region: ohio

    # Free plan: 512 MB RAM, shared CPU, spins down after 15 min idle.
    # First request after spin-down takes ~30–40 s (cold start).
    # Upgrade to starter ($7/mo) or standard ($25/mo) to eliminate cold starts.
    plan: free

    # Render hits this path to determine if the instance is healthy.
    healthCheckPath: /health

    # NOTE: preDeployCommand is not supported on the Free plan (and the
    # Free plan has no Shell tab either, so a migration step can't be run
    # by hand). Migrations instead run automatically as part of
    # backend/Dockerfile's CMD (`alembic upgrade head && uvicorn ...`) on
    # every container start — idempotent, and a genuine migration failure
    # exits non-zero so uvicorn never starts and Render fails the deploy
    # health check instead of promoting a broken instance. See
    # docs/PRODUCTION_DEPLOYMENT.md and docs/DEPLOYMENT.md § 1.

    envVars:
      # ----------------------------------------------------------------
      # Application
      # ----------------------------------------------------------------
      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: false

      # ----------------------------------------------------------------
      # Database  (set to your Neon connection string)
      # Format: postgresql+psycopg2://user:pass@host/dbname?sslmode=require
      # ----------------------------------------------------------------
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard

      # ----------------------------------------------------------------
      # JWT
      # generateValue: true — Render generates and stores a secure random
      # value automatically. Regenerating it invalidates all existing tokens.
      # ----------------------------------------------------------------
      - key: JWT_SECRET_KEY
        generateValue: true

      - key: JWT_ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440

      # ----------------------------------------------------------------
      # Gemini AI
      # ----------------------------------------------------------------
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard

      - key: MAX_QUESTIONS_PER_SESSION
        value: 10

      - key: GEMINI_TIMEOUT_SECONDS
        value: 30

      # ----------------------------------------------------------------
      # Audio processing — DISABLED on free tier to stay under 512 MB RAM.
      # Whisper imports PyTorch (~200–400 MB) at startup when enabled.
      # The UI automatically hides audio upload controls when this is false.
      # ----------------------------------------------------------------
      - key: ENABLE_AUDIO_PROCESSING
        value: false

      - key: WHISPER_MODEL
        value: base

      - key: WHISPER_TIMEOUT_SECONDS
        value: 300

      - key: MAX_TRANSCRIPT_CHARS
        value: 20000

      # ----------------------------------------------------------------
      # File uploads
      # No persistent disk on the free tier. UPLOAD_DIR writes to the
      # container's ephemeral filesystem — files survive restarts but are
      # lost on redeploy. Since audio upload is disabled (above), no user
      # files are actually written here in practice.
      # ----------------------------------------------------------------
      - key: UPLOAD_DIR
        value: /app/uploads

      - key: MAX_UPLOAD_SIZE_MB
        value: 50

      # ----------------------------------------------------------------
      # CORS  (set to your Vercel frontend URL, no trailing slash)
      # Example: https://aiip.vercel.app
      # ----------------------------------------------------------------
      - key: CORS_ORIGINS
        sync: false          # set manually in Render dashboard

      # ----------------------------------------------------------------
      # Observability
      # ----------------------------------------------------------------
      - key: LOG_LEVEL
        value: INFO

      - key: LOG_FORMAT
        value: json

      - key: REQUEST_ID_HEADER
        value: X-Request-ID

      - key: SLOW_REQUEST_THRESHOLD_MS
        value: 1000

      - key: ENABLE_METRICS
        value: true

      - key: ENABLE_TRACING
        value: false

      - key: OTEL_SERVICE_NAME
        value: ai-interview-intelligence-platform

      - key: OTEL_TRACES_SAMPLE_RATE
        value: 1.0

      # Neon Free autosuspends after 5 min idle; cold start takes 1–5 s.
      # 10 s gives Neon enough time to wake up before the check is declared failed.
      - key: READINESS_DB_TIMEOUT_SECONDS
        value: 10.0

# No disk block — free plan does not support persistent disks.
# Audio processing is disabled so no uploaded files need to persist.
