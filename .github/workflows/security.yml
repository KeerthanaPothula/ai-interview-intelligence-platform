name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Dependency Audit (Python)
    runs-on: ubuntu-latest
    # Informational: surfaces advisories against pinned versions without
    # blocking merges. See SECURITY.md "Dependency Security" for the
    # triage process (bump the affected pin, re-run the test suite).
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --no-cache-dir pip-audit==2.7.3
      - run: pip-audit -r requirements.txt

  npm-audit:
    name: Dependency Audit (JavaScript)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev

  secrets-scan:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    # Informational, like pip-audit/npm-audit above: surfaces a likely
    # committed secret without blocking merges on a false positive.
    # gitleaks-action's free tier scans the diff on pull_request events and
    # the full history on push; no GITLEAKS_LICENSE is required for public
    # repos.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
