name: Security

on:
  push:
    branches: [main]
  pull_request:
  # New advisories appear against dependencies that have not changed, so also
  # audit weekly (Mondays 04:17 UTC) — a red run here means "triage this
  # advisory", see SECURITY.md "Dependency Security".
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  # BLOCKING. Fails on any advisory in the production (runtime) dependencies —
  # including transitive ones — that is not documented, with a reason and a
  # removal condition, in backend/pip-audit-exceptions.txt. Also fails if a
  # dependency cannot be audited (--strict), so nothing silently drops out.
  pip-audit:
    name: Dependency Audit (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same version as requirements-dev.txt.
      - run: pip install --no-cache-dir pip-audit==2.7.3

      - name: Audit production dependencies (blocking)
        run: python scripts/audit_dependencies.py

      # Test/lint/audit tooling is never shipped, so its advisories are
      # reported here but must not block a merge. This step is the only place
      # a failure is tolerated, and only because it audits dev-only pins.
      - name: Audit dev tooling (informational, non-blocking)
        continue-on-error: true
        run: |
          sed '/^-r /d' requirements-dev.txt > "$RUNNER_TEMP/requirements-dev-only.txt"
          pip-audit -r "$RUNNER_TEMP/requirements-dev-only.txt" --no-deps --disable-pip --progress-spinner off

  # BLOCKING. Fails on any advisory in the production dependency tree that is
  # not documented in frontend/audit-exceptions.json (see scripts/audit-prod.mjs).
  npm-audit:
    name: Dependency Audit (JavaScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Audit production dependencies (blocking)
        run: npm run audit

      # devDependencies (build/test tooling) never ship to users, so their
      # advisories are reported but must not block a merge.
      - name: Audit all dependencies incl. dev tooling (informational, non-blocking)
        continue-on-error: true
        run: npm audit

  secrets-scan:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    # Informational, like pip-audit/npm-audit above: surfaces a likely
    # committed secret without blocking merges on a false positive.
    # gitleaks-action's free tier scans the diff on pull_request events and
    # the full history on push; no GITLEAKS_LICENSE is required for public
    # repos.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
