name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job here writes to the repo, so the default GITHUB_TOKEN
# only needs to read it.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR so only the latest commit's
# CI keeps consuming runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Lint/format checks are static analysis — they don't need the app's
      # runtime dependencies (FastAPI, torch, etc.) installed, only the
      # tooling itself, which keeps this job fast.
      - run: pip install --no-cache-dir ruff==0.8.1 black==24.10.0

      - name: ruff check
        run: ruff check .

      - name: black --check
        run: black --check .

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint

  backend-test:
    name: Backend Tests + Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # System dependency required by openai-whisper at import time.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: pip install --no-cache-dir -r requirements-dev.txt

      # conftest.py sets safe defaults for DATABASE_URL (in-memory SQLite),
      # JWT_SECRET_KEY, and GEMINI_API_KEY via os.environ.setdefault, so no
      # secrets are required to run the suite in CI.
      - name: Run tests with coverage
        # --cov-fail-under=75: measured coverage is ~80% as of 2026-08-02
        # (see docs/TESTING.md); 75% leaves headroom for normal fluctuation
        # while still failing CI on a real regression. Only applied here
        # (not in pytest.ini) so a local `pytest --cov` on a filtered subset
        # of tests doesn't spuriously fail against the whole app's threshold.
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=75

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  # The backend-test job above builds its schema with create_all on in-memory
  # SQLite, so nothing there executes the Alembic migrations — yet production
  # runs `alembic upgrade head` on Neon PostgreSQL at every container start.
  # This job runs the real migration chain against a real PostgreSQL server.
  # Nothing here is allowed to continue-on-error: a migration that fails on
  # PostgreSQL must fail the build.
  backend-migrations:
    name: Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Same major version as docker-compose.yml (postgres:16-alpine) and a
      # major Neon supports. The credentials are test-only, live for the
      # duration of this job on an ephemeral container, and guard no data.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiip_test
          POSTGRES_PASSWORD: aiip_test_password
          POSTGRES_DB: aiip_test
        ports:
          - 5432:5432
        # Steps only start once this reports healthy, so migrations never race
        # PostgreSQL's startup.
        options: >-
          --health-cmd "pg_isready -U aiip_test -d aiip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Settings validation at import time needs these three (alembic/env.py
      # loads app.config); all are dummies, exactly like backend-test's.
      ENVIRONMENT: development
      JWT_SECRET_KEY: test-only-secret-key-at-least-32-characters-long
      GEMINI_API_KEY: test-gemini-key-not-real
      TEST_DATABASE_URL: postgresql+psycopg2://aiip_test:aiip_test_password@localhost:5432/aiip_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Confirm PostgreSQL is accepting connections
        run: >-
          python -c "import psycopg2; c = psycopg2.connect('${{ env.TEST_DATABASE_URL }}'.replace('+psycopg2', ''));
          cur = c.cursor(); cur.execute('SHOW server_version'); print('PostgreSQL', cur.fetchone()[0])"

      # The exact command the Docker image runs at startup, on an empty database.
      - name: alembic upgrade head (empty database)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic upgrade head

      - name: Database is at the expected head revision
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic heads
          alembic current
          alembic current | grep -q "(head)"

      - name: alembic upgrade head again (must be a no-op)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic upgrade head

      # Tables, indexes, constraints, model drift, idempotency and a
      # downgrade/upgrade round trip. Creates and drops its own databases on
      # the server; the schema comes only from the migrations.
      - name: Migration integrity tests
        env:
          MIGRATION_TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pytest tests/test_migrations_postgres.py -v -rs

  frontend-test:
    name: Frontend Tests + Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: aiip-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
