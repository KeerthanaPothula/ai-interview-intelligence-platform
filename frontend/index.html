<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Lets the browser paint its own chrome (canvas, scrollbars) dark or
         light before the stylesheet arrives; index.css then pins
         color-scheme per data-theme. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#070C18" />
    <!--
      Blocking, synchronous theme script — must run before first paint to
      avoid a flash of the wrong theme. Order: saved aiip-theme, then the OS
      preference, then dark. Storage and matchMedia are guarded separately so
      a blocked localStorage still honors the OS preference. ThemeContext
      (src/context/ThemeContext.tsx) reads the resulting attribute on mount
      rather than re-deciding it; the theme-color values here must match
      THEME_COLOR there.
    -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('aiip-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          try { t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) { t = 'dark'; }
        }
        document.documentElement.setAttribute('data-theme', t);
        document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#F6F8FC' : '#070C18';
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Interview Intelligence Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
