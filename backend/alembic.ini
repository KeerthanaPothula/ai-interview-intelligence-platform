[alembic]
# Path to the migrations directory, relative to this file.
script_location = alembic

# Migration file naming: YYYYMMDD_HHMM_<rev>_<slug>.py
# Chronological order makes git history and directory listings readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

truncate_slug_length = 40
timezone = UTC

# sqlalchemy.url is intentionally left blank here.
# It is set programmatically in alembic/env.py from app.config.get_settings()
# so there is a single source of truth and no credentials in this file.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
